# Isolated HTTPS/HTTP/2 front for novoreatcarto.
# Does not bind :80/:443 (reatcarto.furg.br stays on Apache).
ssl_certificate     /var/www/novoreatcarto/ssl/fullchain.pem;
ssl_certificate_key /etc/ssl/private/reatcarto.furg.br.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_comp_level 5;
gzip_static on;
gzip_types text/plain text/css text/javascript application/javascript application/json application/geo+json image/svg+xml application/xml application/wasm;

server {
    listen 8090 ssl http2;
    listen [::]:8090 ssl http2;
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name reatcarto.furg.br 200.132.255.26 novoreatcarto _;

    root /var/www/novoreatcarto/dist;
    index index.html;
    client_max_body_size 30M;
    keepalive_timeout 65;

    add_header X-Content-Type-Options nosniff always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/(icons|export|geo)/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /php/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
