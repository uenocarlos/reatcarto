# IP/default vhost — same role as the old maress *:80 site.
# Do not set ServerName reatcarto.furg.br (that vhost stays untouched).
<VirtualHost *:80>
    ServerName 200.132.255.26
    ServerAlias novoreatcarto maress
    Protocols http/1.1
    Include /etc/apache2/sites-available/novoreatcarto-app.inc
</VirtualHost>

<VirtualHost *:443>
    ServerName 200.132.255.26
    ServerAlias novoreatcarto maress
    Protocols http/1.1
    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile /etc/ssl/certs/CEPO251010980893.crt
    SSLCertificateKeyFile /etc/ssl/private/reatcarto.furg.br.key
    SSLCertificateChainFile /etc/ssl/certs/intermediate.crt
    Include /etc/apache2/sites-available/novoreatcarto-app.inc
</VirtualHost>
