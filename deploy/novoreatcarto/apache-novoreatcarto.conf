# Isolated vhost — do not use as the default *:80/:443 site.
# Never attach this DocumentRoot to reatcarto.furg.br on 80/443.
Listen 8090
Listen 8443

<VirtualHost *:8090>
    ServerName novoreatcarto
    Protocols http/1.1
    Include /etc/apache2/sites-available/novoreatcarto-app.inc
</VirtualHost>

<VirtualHost *:8443>
    ServerName reatcarto.furg.br
    ServerAlias novoreatcarto 200.132.255.26
    Protocols h2 http/1.1

    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile /etc/ssl/certs/CEPO251010980893.crt
    SSLCertificateKeyFile /etc/ssl/private/reatcarto.furg.br.key
    SSLCertificateChainFile /etc/ssl/certs/intermediate.crt

    Include /etc/apache2/sites-available/novoreatcarto-app.inc
</VirtualHost>
